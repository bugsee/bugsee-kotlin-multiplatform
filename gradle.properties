#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
# Configuration cache is disabled because the vanniktech maven-publish plugin's
# publish tasks are not configuration-cache compatible. Re-enable only if you
# verify that :library:publishAndReleaseToMavenCentral still works.
org.gradle.configuration-cache=false
#Kotlin
kotlin.code.style=official
#kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
# Fix for Xcode 16.4 compatibility
kotlin.native.cacheKind=none
# kotlin.native.binary.memoryModel=experimental
kotlin.apple.xcodeCompatibility.nowarn=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
