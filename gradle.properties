# Renamed from GROUP/VERSION_NAME: the vanniktech maven-publish plugin
# auto-reads those exact property names and finalizes groupId/version on the
# mavenPublishing extension, which then makes the explicit coordinates(...)
# call in library/build.gradle.kts fail with "property is final and cannot
# be changed any further". Using non-standard names avoids that coupling.
LIB_GROUP=com.bugsee
# Library version lives in repo-root version.txt; library/ and library-protect/
# build scripts read it at configuration time. deploy.sh also reads version.txt.

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
# Configuration cache is disabled. It was off because the vanniktech maven-publish
# plugin's publish tasks did not support it; the plugin does since 0.34, but the
# rest of this build (Kotlin SwiftPM import, buildSrc tasks, the Bugsee Gradle
# plugin) has not been checked with it. Re-enable only after checking the build,
# the tests and :library:publishAndReleaseToMavenCentral with it.
org.gradle.configuration-cache=false
#Kotlin
kotlin.code.style=official
#kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
# kotlin.native.binary.memoryModel=experimental
kotlin.apple.xcodeCompatibility.nowarn=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
