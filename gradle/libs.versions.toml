[versions]
agp = "9.4.1"
kotlin = "2.4.21"
# iOS SDK the library links (SwiftPM package github.com/bugsee/spm) and whose option manifest
# generates BugseeLaunchOptions.
bugsee-ios = "7.0.1"
bugsee-android = "7.5.1"
android-minSdk = "24"
# The published modules. Since AGP 9 (android.aar.metadata.defaultMinCompileSdkToCompileSdk, on
# by default) each AAR declares compileSdk as minCompileSdk, which consumers must meet
# (MIGRATION.md states it), so raise it only when a library needs a newer API.
android-compileSdk = "35"
android-targetSdk = "35"
# The sample (composeApp, androidApp): Compose Multiplatform 1.12 (AndroidX Compose 1.12) needs
# compileSdk 37 and AGP 9.1+.
sample-compileSdk = "37"
coroutines = "1.3.0"
ktor3 = "3.6.1"
# The Compose Multiplatform Gradle plugin and the sample.
compose-multiplatform = "1.12.2"
# What library-protect compiles against and declares in its POM: the oldest Compose it supports.
# An app with a newer Compose gets its own version through dependency resolution; raising this
# would move every consumer onto it (1.12 needs compileSdk 37 and AGP 9.1+).
compose-multiplatform-protect = "1.9.3"
# Compose Material 3 for Compose Multiplatform has its own versions; 1.9.0 is the one the
# Compose Multiplatform 1.12 plugin maps compose.material3 to.
compose-material3 = "1.9.0"
androidx-activity = "1.10.1"
androidx-fragment = "1.8.5"
androidx-test = "1.5.0"
robolectric = "4.12.1"
junit = "4.13.2"
mockito = "5.8.0"
buildKonfig = "0.24.0"
bugseeGradle = "4.0.7"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
bugsee-android = { module = "com.bugsee:bugsee-android", version.ref = "bugsee-android" }
bugsee-android-feedback = { module = "com.bugsee:bugsee-android-feedback", version.ref = "bugsee-android" }

# Kotlin Libraries
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
ktor3-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor3" }
ktor3-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor3" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# The sample's Compose (the compose.* accessors are deprecated in Compose Multiplatform 1.12).
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
compose-protect-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform-protect" }
compose-protect-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform-protect" }
compose-protect-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform-protect" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }

# Testing Libraries
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version = "5.3.1" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
buildKonfig = { id = "com.codingfeline.buildkonfig", version.ref = "buildKonfig" }
bugsee-gradle-plugin = { id = "com.bugsee.android.gradle", version.ref = "bugseeGradle" }