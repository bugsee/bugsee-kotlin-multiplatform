[versions]
agp = "8.6.0"
kotlin = "2.2.0"
bugsee-ios = "5.5.7"
bugsee-android = "5.8.4"
android-minSdk = "24"
android-compileSdk = "35"
android-targetSdk = "35"
okhttp3 = "3.14.9"
okhttp2 = "2.7.5"
animal-sniffer = "1.18"
jsr305 = "3.0.2"
conscrypt = "2.0.0"
material = "1.3.0"
picasso = "2.8"
coroutines = "1.3.0"
ktor = "2.3.0"
ktor3 = "3.2.3"
compose-multiplatform = "1.8.2"
androidx-activity = "1.10.1"
androidx-test = "1.5.0"
robolectric = "4.12.1"
junit = "4.13.2"
mockito = "5.8.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
bugsee-android = { module = "com.bugsee:bugsee-android", version.ref = "bugsee-android" }

# HTTP Client Libraries
okhttp3 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp3" }
okhttp2 = { module = "com.squareup.okhttp:okhttp", version.ref = "okhttp2" }

# Utility Libraries
animal-sniffer-annotations = { module = "org.codehaus.mojo:animal-sniffer-annotations", version.ref = "animal-sniffer" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
conscrypt-openjdk-uber = { module = "org.conscrypt:conscrypt-openjdk-uber", version.ref = "conscrypt" }

# UI & Image Libraries
material = { module = "com.google.android.material:material", version.ref = "material" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }

# Kotlin Libraries
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor3-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor3" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# Testing Libraries
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version = "5.3.1" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.29.0" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }