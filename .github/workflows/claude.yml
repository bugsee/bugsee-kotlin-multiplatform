name: Claude Code

# Answers an `@claude` mention on an issue, a PR, a PR review, or a review
# comment. The automatic per-PR review lives in claude-code-review.yml.
#
# This repository is PUBLIC, so anyone can write "@claude". The action itself
# refuses actors without write access to the repository (its permission check
# runs before Claude does), so an outsider's mention ends as a failed run, not
# as work done. It is not filtered here on `author_association`, because GitHub
# reports private org members inconsistently in event payloads and a filter
# would silently drop legitimate mentions.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # read, not write: Claude answers and reviews but cannot push. On a public
      # repository it may be asked to act on an issue or PR written by an outsider,
      # so it must not be able to change code on the strength of that text.
      contents: read
      # write, not read: an @claude mention answers by commenting on the PR or issue.
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Org-level secret (visibility: all repositories).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Lets Claude read the pr.yml job logs when asked why CI is red.
          additional_permissions: |
            actions: read

          # No `prompt:` on purpose — without one the action follows the instructions
          # in the comment that tagged it, which is the point of a mention handler.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
