name: Claude Code Review

# Posts an automated review on every pull request. Reads only -- it never
# builds, tests, or pushes. `pr.yml` owns the build and test suite.
#
# Ported from bugsee-android / bugsee-cocoa; the differences all follow from this
# repository being PUBLIC (see the comments below).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Deliberately no `branches:` filter, unlike pr.yml: PRs stacked onto other
    # feature branches deserve a review too.

# A new push supersedes the review of the previous one; without this, rapid
# pushes queue several reviews that all comment on the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork PRs receive no secrets, so the action could only fail on them. Only PRs
    # from branches of this repository (i.e. people with write access) are reviewed.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # write, not read: the review posts inline comments back onto the PR.
      pull-requests: write
      issues: write
      # gh pr view reads statusCheckRollup, which 403s without this.
      checks: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # Org-level secret (visibility: all repositories).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately not the code-review plugin. It delegates each step to sub-agents, and
          # the Agent tool here is async: it yields for a notification that a single-shot CI run
          # never delivers. Denied that, it burns turns shelling out instead. A direct prompt is
          # single-shot by construction.
          #
          # The review task itself (from "## Deep Code Review" to the "Finish with" list) is
          # the team's shared review prompt template, kept verbatim. The context above it and
          # the posting instructions below it are specific to this repository and this action.
          prompt: |
            Review pull request ${{ github.event.pull_request.number }} in ${{ github.repository }}.

            ## Repository context

            This is the Bugsee Kotlin Multiplatform SDK: a public wrapper, published to Maven
            Central as `com.bugsee:bugsee-kotlin-multiplatform` and
            `com.bugsee:bugsee-kotlin-multiplatform-protect`, around the native Bugsee Android
            and iOS SDKs. Read `CLAUDE.md` first — it describes the modules and the expect/actual
            architecture. Areas where this codebase breaks in ways a compiler will not catch:

            - Platform parity: a change to a `commonMain` declaration must behave the same in its
              `androidMain` and `iosMain` actuals — launch-option defaults and their translation
              into the native SDKs' option maps, callback semantics, and null handling.
            - Kotlin/Native ↔ Objective-C interop: retain cycles and lifetime in
              `BugseeDelegateWrapper` (weak references), callbacks arriving on non-main threads,
              `NSException` ↔ Kotlin exception bridging, cinterop nullability, ARGB `Int` ↔
              `UIColor` conversion.
            - Android: `compileOnly` dependencies that may be absent in the host app at runtime,
              and assumptions about the native SDK version pinned in `gradle/libs.versions.toml`.
            - Public API and compatibility: explicit API mode is on, so every `public` change in
              `commonMain` is a change for integrators of the published artifacts; `:library` and
              `:library-protect` ship in lockstep from `version.txt`.
            - Build, publishing and CI: signing, credentials and secrets in a PUBLIC repository.

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`, and read the
            surrounding code where you need context. Do not build, run Gradle or `scripts/*.sh`,
            lint, or modify the checkout — this runner has no Xcode or Android SDK, and CI covers
            that separately.

            ## Deep Code Review

            Perform a **thorough, senior-level code review of this PR**. Your goal is to find real bugs and risks, not to produce generic style feedback.

            First understand the PR's intent and inspect the surrounding code, callers, dependencies, tests, and relevant repository patterns. **Do not review the diff in isolation.**

            Look for:

            * Logic and correctness bugs, including edge cases and incorrect assumptions
            * Regressions and backwards-compatibility issues
            * Error handling and failure/retry behavior
            * Race conditions, concurrency and lifecycle problems
            * Data integrity, persistence and state-management issues
            * Security vulnerabilities
            * Performance and resource-usage regressions
            * Missing validation, tests, migrations, or related changes
            * Architectural or maintainability problems that create meaningful risk

            Think adversarially: try to construct concrete scenarios that would break the implementation, including malformed/empty/unexpected input, failures, retries, concurrency, restarts, stale state, and high load where relevant.

            **Do not report speculative or purely stylistic issues.** Every finding must have a credible failure scenario and be supported by the actual code.

            For each finding provide:

            * **Severity:** P0 Critical / P1 High / P2 Medium / P3 Low
            * **Location:** file and line
            * **Problem:** what is wrong
            * **Impact:** why it matters
            * **Scenario:** how it can actually happen
            * **Fix:** recommended solution

            Prioritize **high-signal findings over quantity**. Re-check every finding before reporting it and do not claim to have run tests or tools unless you actually did.

            Finish with:

            1. Overall risk: Low / Medium / High / Critical
            2. Merge recommendation
            3. The most important issues to fix
            4. Brief positive observations, if any

            ## Posting the review

            Post the review on the PR in two parts. Do not print it only to the log — nobody reads
            that.

            1. One INLINE comment per finding, on the line it is about, using the
               mcp__github_inline_comment__create_inline_comment tool. Start it with the severity
               (e.g. `**P1 High**`), then Problem, Impact, Scenario and Fix — the location is the
               line itself. Inline comments can only go on lines this PR changed; GitHub rejects
               the rest. A finding whose location is outside the diff goes into the summary
               instead, with every field including Location.

            2. Then exactly ONE summary comment on the conversation, with
               `gh pr comment ${{ github.event.pull_request.number }} --body-file <file>` (write the
               body to a file first, so quoting cannot mangle it). This is the part a reviewer
               reads first. Do not repeat the inline comments — reference them.

            ALWAYS post the summary, even with nothing to report — a silent run is
            indistinguishable from a broken one. Use this shape:

            ### Code review

            <one or two sentences on what the change does and whether it holds together>

            **Findings:** N inline, M in this summary — by severity: P0 a · P1 b · P2 c · P3 d — or "None."

            <findings outside the diff, if any, with all six fields>

            1. **Overall risk:** Low / Medium / High / Critical
            2. **Merge recommendation:** <merge as is / fix the P0–P1 ones first / and why>
            3. **Most important issues to fix:** <ordered list referencing the findings>
            4. **Positive observations:** <brief, if any>

          claude_args: >-
            --allowedTools
            "Read,Grep,Glob,Bash,Write,mcp__github_inline_comment__create_inline_comment"
          # --allowedTools REPLACES the default tool list rather than adding to it, so every
          # tool the prompt needs has to be named here (Write: the summary body file).

          # NOT `show_full_output: true`, which bugsee-android/-cocoa use for debugging: it prints
          # the full agent transcript, which can echo tool output, into the job log — and this
          # repository's Actions logs are public. The always-post-a-summary rule above is what
          # tells a silent failure apart from a clean review here.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
